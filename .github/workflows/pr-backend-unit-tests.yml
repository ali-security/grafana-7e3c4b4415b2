name: Backend Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'seal/**'

permissions:
  contents: read

env:
  EDITION: 'oss'
  WIRE_TAGS: 'oss'

jobs:
  backend-testing-coverage:
    name: Backend Testing & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential shared-mime-info
          go install github.com/mfridman/tparse@c1754a1f484ac5cd422697b0fec635177ddc8507 # v0.17.0

      - name: Generate Go code
        run: make gen-go

      - name: Run unit tests
        run: COVER_OPTS="-coverprofile=be-unit.cov -coverpkg=github.com/grafana/grafana/..." GO_TEST_OUTPUT="/tmp/unit.log" make test-go-unit

      - name: Summarize failures
        if: always()
        run: grep -E '^(--- FAIL|FAIL|panic:|ok )' /tmp/unit.log | grep -v '^ok ' | head -200 || true

      - name: Upload unit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-log
          path: /tmp/unit.log
